# Hébergement de test gratuit de Maefa Store sur Render (https://render.com)
# Render → New → Blueprint → choisir ce dépôt : le site se construit et se lance tout seul.
# Offre gratuite : le site s'endort après 15 min sans visite (≈ 30 s pour se réveiller)
# et les commandes de test s'effacent à chaque redémarrage.
services:
  - type: web
    name: maefa-store
    runtime: node
    plan: free
    region: frankfurt
    rootDir: maefa-store
    branch: claude/fabima-store-ecommerce-kd873w
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Code de l'espace gérante : demandé à la création (choisissez-en un autre que 2026)
      - key: ADMIN_PIN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OWNER_WHATSAPP
        value: "+221773093819"
      # Site de test : caché de Google (à retirer pour le vrai site)
      - key: NOINDEX
        value: "1"
