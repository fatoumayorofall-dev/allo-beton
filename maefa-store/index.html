    <!--seo-->
    <title>Maefa Store — Chaussures & sacs pour elle · Sénégal</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maefa Store — Chaussures & sacs pour elle" />
    <meta property="og:description" content="Chaussures et sacs pour femme. Livraison rapide à Dakar, paiement Wave, Orange Money ou à la livraison." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:site_name" content="Maefa Store" />
    <meta property="og:locale" content="fr_SN" />
    <link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Store",
            "@id": "/#boutique",
            "name": "Maefa Store",
            "description": "Chaussures et sacs pour femme à Dakar : livraison rapide, paiement Wave, Orange Money ou à la livraison.",
            "url": "/",
            "logo": "/icons/icon-512.png",
            "image": "/og-image.jpg",
            "telephone": "+221770000000",
            "email": "contact@maefastore.sn",
            "priceRange": "10 000 – 60 000 FCFA",
            "currenciesAccepted": "XOF",
            "paymentAccepted": "Wave, Orange Money, Free Money, carte bancaire, espèces à la livraison",
            "address": { "@type": "PostalAddress", "streetAddress": "Sacré-Cœur 3", "addressLocality": "Dakar", "addressCountry": "SN" },
            "geo": { "@type": "GeoCoordinates", "latitude": 14.7195, "longitude": -17.4655 },
            "openingHoursSpecification": [
              { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "20:00" },
              { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "10:00", "closes": "20:00" },
              { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "15:00", "closes": "19:00" }
            ],
            "sameAs": ["https://instagram.com/maefastore", "https://facebook.com/maefastore", "https://tiktok.com/@maefastore"]
          },
          {
            "@type": "WebSite",
            "name": "Maefa Store",
            "url": "/",
            "inLanguage": "fr-SN",
            "potentialAction": { "@type": "SearchAction", "target": "/boutique?q={search_term_string}", "query-input": "required name=search_term_string" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
