    post:
      tags: [Avis]
      summary: 'Publier un avis ou une question (liens et numéros refusés) ; « Cliente vérifiée » si la pièce a été livrée'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author, text]
