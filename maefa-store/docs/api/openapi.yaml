openapi: 3.0.3
info:
  title: API Maefa Store
  version: 1.0.0
  description: |
    API REST du serveur Maefa Store (Node.js + Express). Toutes les réponses sont en JSON.
    Ouvrir ce fichier dans https://editor.swagger.io pour une page interactive.

    Accès :
    - **gérante** : en-tête `x-admin-pin` (jeton signé obtenu par `POST /api/admin/login`) ;
    - **cliente connectée** : en-tête `Authorization: Bearer <jeton>` (obtenu par `/api/auth/verify`) ;
    - **livreur** : jeton secret dans l'adresse (`/api/driver/{token}`, `/api/tour/{token}`).
servers:
  - url: https://maefa-store.onrender.com
  - url: http://localhost:8787
components:
  securitySchemes:
    admin: { type: apiKey, in: header, name: x-admin-pin }
    session: { type: http, scheme: bearer }
  schemas:
    Erreur:
      type: object
      properties: { error: { type: string, example: 'Accès gérante requis' } }
    ArticleDemande:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, example: MAE-103 }
        name: { type: string }
        price: { type: integer, description: "Prix en FCFA (absent tant que la demande n'est pas confirmée)" }
        catalogPrice: { type: integer, description: 'Prix catalogue quand un autre prix a été convenu' }
        color: { type: string }
        size: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    Demande:
      type: object
      properties:
        id: { type: string, pattern: '^DEM-[A-HJ-NP-Z2-9]{5}$', example: DEM-K7Q2M }
        status: { type: string, enum: [nouvelle, disponible, indisponible, commandee] }
        items: { type: array, items: { $ref: '#/components/schemas/ArticleDemande' } }
        total: { type: integer }
        note: { type: string }
        orderId: { type: string, nullable: true }
paths:
  /api/health:
    get:
      tags: [Système]
      summary: 'État du serveur et des services branchés (assistante IA, WhatsApp, API gérante)'
      responses:
        '200': { description: OK }
  /api/stats:
    get:
      tags: [Système]
      summary: 'Statistiques de visites'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/track:
    post:
      tags: [Système]
      summary: "Enregistre la visite d'une fiche produit"
      responses:
        '200': { description: OK }
  /api/catalog:
    get:
      tags: [Catalogue]
      summary: 'Catalogue publié (prix confidentiels : classe de prix côté affichage)'
      responses:
        '200': { description: OK }
  /api/admin/catalog:
    put:
      tags: [Catalogue]
      summary: 'Publier tout le catalogue'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/catalog/products/{id}:
    put:
      tags: [Catalogue]
      summary: 'Créer ou modifier un produit'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
    delete:
      tags: [Catalogue]
      summary: 'Supprimer un produit'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/catalog/products/{id}/reviews:
    post:
      tags: [Catalogue]
      summary: 'Laisser un avis'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/stock-alerts:
    post:
      tags: [Catalogue]
      summary: 'Demander une alerte de retour en stock'
      responses:
        '200': { description: OK }
  /api/admin/stock-alerts:
    get:
      tags: [Catalogue]
      summary: 'Liste des alertes de retour en stock'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/stock-alerts/{productId}:
    delete:
      tags: [Catalogue]
      summary: "Clore les alertes d'un produit"
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/requests:
    post:
      tags: [Demandes WhatsApp]
      summary: "Noter une demande d'achat (référence DEM-XXXXX)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, items]
              properties:
                id: { type: string, example: DEM-K7Q2M }
                items: { type: array, items: { $ref: '#/components/schemas/ArticleDemande' } }
                customer:
                  {
                    type: object,
                    properties: { firstName: { type: string }, phone: { type: string }, zone: { type: string } },
                  }
      responses:
        '201': { description: Demande notée }
        '400':
          {
            description: Référence ou articles invalides,
            content: { application/json: { schema: { $ref: '#/components/schemas/Erreur' } } },
          }
  /api/requests/{id}:
    get:
      tags: [Demandes WhatsApp]
      summary: "État d'une demande ; prix exacts seulement une fois confirmée"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          { description: Demande, content: { application/json: { schema: { $ref: '#/components/schemas/Demande' } } } }
        '404': { description: Demande introuvable }
  /api/admin/requests:
    get:
      tags: [Demandes WhatsApp]
      summary: 'Demandes reçues'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/requests/{id}:
    patch:
      tags: [Demandes WhatsApp]
      summary: 'Répondre : disponible / pas disponible, note, prix convenus'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [nouvelle, disponible, indisponible] }
                note: { type: string, maxLength: 300 }
                prices:
                  {
                    type: array,
                    items: { type: integer, minimum: 1 },
                    description: "Prix convenus, un par article, dans l'ordre",
                  }
      responses:
        '200':
          {
            description: Demande mise à jour,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { request: { $ref: '#/components/schemas/Demande' } } } },
              },
          }
        '400': { description: Statut ou prix invalides }
        '403': { description: Accès gérante requis }
        '409': { description: Demande déjà commandée }
  /api/orders/check:
    post:
      tags: [Commandes]
      summary: 'Vérification avant paiement : stock, prix (catalogue ou convenus), moyen de paiement'
      responses:
        '200': { description: OK }
  /api/orders:
    post:
      tags: [Commandes]
      summary: 'Passer commande (totaux, stock et prix contrôlés par le serveur)'
      responses:
        '200': { description: OK }
  /api/orders/lookup:
    get:
      tags: [Commandes]
      summary: "Suivi d'une commande (numéro + téléphone)"
      responses:
        '200': { description: OK }
  /api/orders/rating:
    post:
      tags: [Commandes]
      summary: 'Noter la livraison'
      responses:
        '200': { description: OK }
  /api/admin/orders:
    get:
      tags: [Commandes]
      summary: 'Liste des commandes'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/orders/{id}:
    patch:
      tags: [Commandes]
      summary: "Changer le statut ou le paiement d'une commande"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/orders/{id}/driver:
    post:
      tags: [Livraison]
      summary: 'Confier une commande à un livreur'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/orders/{id}/relay:
    put:
      tags: [Livraison]
      summary: 'Relais entre livreurs'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/orders/{id}/supplier:
    patch:
      tags: [Le Marché]
      summary: 'Suivi de la commande fournisseur'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/driver/{token}:
    get:
      tags: [Livraison]
      summary: 'Fiche du livreur pour une commande'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/driver/{token}/start:
    post:
      tags: [Livraison]
      summary: 'Départ du livreur'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/driver/{token}/position:
    post:
      tags: [Livraison]
      summary: 'Position GPS du livreur'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/driver/{token}/delivered:
    post:
      tags: [Livraison]
      summary: 'Colis remis (code de livraison)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/admin/tours:
    get:
      tags: [Tournées]
      summary: 'Tournées enregistrées'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
    post:
      tags: [Tournées]
      summary: 'Enregistrer une tournée et créer le lien livreur'
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/tours/plan:
    post:
      tags: [Tournées]
      summary: "Calculer l'ordre optimal des arrêts (temps de trajet routiers)"
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/admin/tours/{id}:
    delete:
      tags: [Tournées]
      summary: 'Supprimer une tournée'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ admin: [] }]
      responses:
        '200': { description: OK }
        '403': { description: Accès refusé }
  /api/tour/{token}:
    get:
      tags: [Tournées]
      summary: 'Tournée du livreur, arrêt par arrêt'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/tour/{token}/skip:
    post:
      tags: [Tournées]
      summary: 'Reporter un arrêt'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/geo/search:
    get:
      tags: [Géolocalisation]
      summary: 'Rechercher une adresse ou un lieu'
      responses:
        '200': { description: OK }
  /api/geo/reverse:
    get:
      tags: [Géolocalisation]
      summary: "Adresse d'un point de la carte"
      responses:
        '200': { description: OK }
  /api/geo/nearby:
    get:
      tags: [Géolocalisation]
      summary: "Lieux connus autour d'un point (mosquée, pharmacie, école…)"
      responses:
        '200': { description: OK }
  /api/auth/start:
    post:
      tags: [Comptes clientes]
      summary: 'Envoyer un code de connexion par SMS'
      responses:
        '200': { description: OK }
  /api/auth/verify:
    post:
      tags: [Comptes clientes]
      summary: 'Vérifier le code, ouvrir la session'
      responses:
        '200': { description: OK }
  /api/auth/pin:
    post:
      tags: [Comptes clientes]
      summary: 'Connexion par code personnel'
      responses:
        '200': { description: OK }
  /api/auth/logout:
    post:
      tags: [Comptes clientes]
      summary: 'Se déconnecter'
      security: [{ session: [] }]
      responses:
        '200': { description: OK }
  /api/me:
    get:
      tags: [Comptes clientes]
      summary: 'Profil de la cliente'
      security: [{ session: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Comptes clientes]
      summary: 'Modifier le profil et les adresses enregistrées'
      security: [{ session: [] }]
      responses:
        '200': { description: OK }
    delete:
      tags: [Comptes clientes]
      summary: "Droit à l'effacement : supprimer le compte, ses sessions et son historique"
      security: [{ session: [] }]
      responses:
        '200': { description: Compte supprimé }
        '401': { description: Non connectée }
        '409': { description: Une commande est en cours }
  /api/me/export:
    get:
      tags: [Comptes clientes]
      summary: "Droit d'accès (loi 2008-12) : toutes les données gardées sur la cliente"
      security: [{ session: [] }]
      responses:
        '200': { description: Fichier JSON (profil, adresses, commandes), sans le code secret }
        '401': { description: Non connectée }
  /api/auth/passkey/options:
    post:
      tags: [Face ID]
      summary: 'Connexion par Face ID / empreinte : défi à signer (le téléphone choisit son compte)'
      responses:
        '200': { description: 'challengeId + options WebAuthn (PublicKeyCredentialRequestOptions)' }
        '429': { description: Trop d'essais }
  /api/auth/passkey/verify:
    post:
      tags: [Face ID]
      summary: 'Vérifie la signature du téléphone et ouvre une session'
      responses:
        '200': { description: 'Jeton de session (JWT) + profil' }
        '400': { description: Défi expiré ou déjà utilisé }
        '401': { description: Signature refusée }
        '404': { description: Appareil inconnu pour ce compte }
  /api/me/passkeys/options:
    post:
      tags: [Face ID]
      summary: 'Activer Face ID sur ce téléphone : options de création de la clé'
      security: [{ session: [] }]
      responses:
        '200': { description: 'Options WebAuthn (PublicKeyCredentialCreationOptions)' }
  /api/me/passkeys:
    get:
      tags: [Face ID]
      summary: 'Appareils où Face ID / l’empreinte est activé'
      security: [{ session: [] }]
      responses:
        '200': { description: 'Nom, dates ; jamais la clé publique' }
    post:
      tags: [Face ID]
      summary: 'Enregistre la clé publique créée par le téléphone'
      security: [{ session: [] }]
      responses:
        '201': { description: Appareil activé }
        '400': { description: Réponse invalide ou défi expiré }
  /api/me/passkeys/{id}:
    delete:
      tags: [Face ID]
      summary: 'Retirer un appareil'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /api/admin/passkey/status:
    get:
      tags: [Face ID]
      summary: 'Face ID est-il activé pour l’espace gérant ?'
      responses:
        '200': { description: '{ enabled }' }
  /api/admin/passkey/options:
    post:
      tags: [Face ID]
      summary: 'Entrée gérante par Face ID : défi à signer (appareils autorisés seulement)'
      responses:
        '200': { description: challengeId + options }
        '404': { description: Aucun appareil activé (ou ADMIN_PIN changé depuis) }
  /api/admin/passkey/verify:
    post:
      tags: [Face ID]
      summary: 'Vérifie la signature et donne le jeton gérante (12 h)'
      responses:
        '200': { description: 'Jeton JWT gérante' }
        '401': { description: Appareil non autorisé ou signature refusée }
  /api/admin/passkeys/options:
    post:
      tags: [Face ID]
      summary: 'Activer Face ID pour l’espace gérant sur ce téléphone'
      security: [{ admin: [] }]
      responses:
        '200': { description: Options WebAuthn }
  /api/admin/passkeys:
    get:
      tags: [Face ID]
      summary: 'Appareils autorisés pour l’espace gérant'
      security: [{ admin: [] }]
      responses:
        '200': { description: Liste des appareils }
    post:
      tags: [Face ID]
      summary: 'Enregistre un appareil de la gérante (lié au code PIN du moment)'
      security: [{ admin: [] }]
      responses:
        '201': { description: Appareil activé }
  /api/admin/passkeys/{id}:
    delete:
      tags: [Face ID]
      summary: 'Retirer un appareil de la gérante'
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /api/mp/events:
    post:
      tags: [Place de marché]
      summary: 'Gestes anonymes (vue, regard, j’aime, panier, partage, passé) : tendance des articles'
      responses: { '204': { description: Reçus }, '400': { description: Identifiant de visite invalide } }
  /api/mp/feed:
    post:
      tags: [Place de marché]
      summary: 'Fil « Pour vous » : classement selon les goûts (envoyés par le téléphone), la tendance, la distance'
      responses: { '200': { description: 'Articles avec leur raison (why)' } }
  /api/mp/me/videos:
    post:
      tags: [Place de marché]
      summary: 'Vidéo d’un article (MP4, MOV ou WebM, 40 Mo au plus, format contrôlé au contenu)'
      security: [{ session: [] }]
      responses: { '201': { description: Adresse de la vidéo }, '415': { description: Pas une vidéo } }
  /api/mp/me/driver:
    get:
      tags: [Livreurs]
      summary: 'Mon espace livreur : profil, solde, course en cours'
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
    post:
      tags: [Livreurs]
      summary: 'S’inscrire comme livreur (validation par la gérante)'
      security: [{ session: [] }]
      responses: { '201': { description: Inscrit }, '400': { description: Champ invalide } }
  /api/mp/me/driver/presence:
    post:
      tags: [Livreurs]
      summary: 'Disponible ou non, avec la position (courses les plus proches d’abord)'
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
  /api/mp/driver/trips:
    get:
      tags: [Livreurs]
      summary: 'Courses prêtes : mode, colis, distance, gain (sans adresse exacte)'
      security: [{ session: [] }]
      responses: { '200': { description: OK }, '423': { description: Inscription pas encore validée } }
  /api/mp/driver/trips/{id}/accept:
    post:
      tags: [Livreurs]
      summary: 'Prendre une course (une seule à la fois)'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        { '200': { description: 'Arrêts dans l’ordre, contacts, montants' }, '409': { description: Déjà prise } }
  /api/mp/driver/trips/{id}/stop:
    post:
      tags: [Livreurs]
      summary: 'Arrêt fait : colis enlevé, ou déposé et encaissé (partage de l’argent calculé)'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { description: Étape impossible } }
  /api/mp/driver/orders/{id}/payout:
    post:
      tags: [Livreurs]
      summary: 'Part du vendeur envoyée (Wave, Orange Money)'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/mp/me/sales/{id}/payout:
    patch:
      tags: [Place de marché]
      summary: 'Vendeur : argent du livreur bien reçu'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/mp/me/plan-request:
    post:
      tags: [Place de marché]
      summary: 'Vendeur : demander la formule Pro'
      security: [{ session: [] }]
      responses: { '200': { description: OK } }
  /api/admin/mp/sellers/{id}/plan:
    post:
      tags: [Place de marché]
      summary: 'Gérante : activer ou prolonger la formule Pro (N mois, paiement enregistré)'
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/admin/mp/drivers:
    get:
      tags: [Livreurs]
      summary: 'Gérante : livreurs, gains, sommes dues, versements en attente'
      security: [{ admin: [] }]
      responses: { '200': { description: OK } }
  /api/admin/mp/drivers/{id}:
    patch:
      tags: [Livreurs]
      summary: 'Gérante : valider ou suspendre un livreur'
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/admin/mp/drivers/{id}/payments:
    post:
      tags: [Livreurs]
      summary: 'Gérante : commissions reçues du livreur'
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: OK } }
  /api/admin/mp/trips:
    get:
      tags: [Livreurs]
      summary: 'Gérante : courses (groupes moitié-moitié, express)'
      security: [{ admin: [] }]
      responses: { '200': { description: OK } }
  /api/admin/mp/trips/{id}/close:
    post:
      tags: [Livreurs]
      summary: 'Gérante : lancer un groupe moitié-moitié sans attendre l’heure'
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/mp/config:
    get:
      tags: [Place de marché]
      summary: 'Rayons, frais de service et barème de livraison'
      responses: { '200': { description: OK } }
  /api/mp/listings:
    get:
      tags: [Place de marché]
      summary: 'Articles publiés (recherche q, rayon cat, vendeur, tri, page)'
      responses: { '200': { description: '24 articles par page, sans téléphone' } }
  /api/mp/listings/{id}:
    get:
