        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: k, in: query, schema: { type: integer, maximum: 8, default: 4 } }
      responses:
        '200':
          description: Pièces recommandées
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids: { type: array, items: { type: string } }
                  source: { type: string, enum: [collaboratif, contenu] }
