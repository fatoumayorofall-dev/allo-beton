        content:
          application/json:
            schema:
              type: object
              properties:
                visitor: { type: string, example: 3f2c9a1e-7b4d-4e2a-9c1f-5d6e7f8a9b0c }
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      t: { type: string, enum: [view, wish, cart, request] }
                      p: { type: string, example: MAE-103 }
      responses:
        '202': { description: Événements valides gardés (champ kept) }
